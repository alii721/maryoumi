<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>H.B.D Maryoumi♥️</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Great+Vibes&display=swap">
  <style>
    :root {
      --bg1: #fff1f3;
      --bg2: #ffd3df;
      --ink: #4a1f2e;
      --accent: #c2506f;
      --gold: #b8893a;
      --card: rgba(255, 255, 255, .72);
      --line: rgba(194, 80, 111, .25);
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg1: #1b0d16;
        --bg2: #3b1a2d;
        --ink: #fbe9ee;
        --accent: #f08aa5;
        --gold: #e6c57a;
        --card: rgba(255, 255, 255, .07);
        --line: rgba(240, 138, 165, .3);
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg1: #1b0d16;
      --bg2: #3b1a2d;
      --ink: #fbe9ee;
      --accent: #f08aa5;
      --gold: #e6c57a;
      --card: rgba(255, 255, 255, .07);
      --line: rgba(240, 138, 165, .3);
      color-scheme: dark
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg1) 70%) fixed;
      color: var(--ink);
      font-family: 'Amiri', serif;
      font-size: 19px;
      line-height: 2;
      overflow-x: hidden
    }

    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0
    }

    .fl {
      position: absolute;
      bottom: -40px;
      color: var(--accent);
      opacity: 0;
      animation: rise linear infinite
    }

    @keyframes rise {
      0% {
        transform: translateY(0) rotate(0);
        opacity: 0
      }

      10% {
        opacity: .5
      }

      100% {
        transform: translateY(-110vh) rotate(40deg);
        opacity: 0
      }
    }

    .stage {
      position: relative;
      z-index: 1;
      display: none;
      min-height: 100vh;
      padding: 28px 18px 48px;
      max-width: 640px;
      margin: 0 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    .stage.on {
      display: flex;
      animation: in 1.1s ease both
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    h1,
    h2 {
      font-family: 'Aref Ruqaa', serif;
      color: var(--accent);
      margin: 0 0 .4em;
      font-weight: 700;
      text-align: center
    }

    .paper {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 26px 22px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 14px 40px rgba(194, 80, 111, .15);
      width: 100%
    }

    .paper p {
      margin: 0 0 .9em;
      opacity: 0;
      transform: translateY(10px);
      animation: in 1.2s ease forwards
    }

    .paper .to {
      font-family: 'Aref Ruqaa', serif;
      font-size: 1.35em;
      color: var(--accent)
    }

    .paper .em {
      color: var(--gold);
      font-weight: 700
    }

    .paper .sig {
      text-align: center;
      color: var(--accent);
      font-family: 'Aref Ruqaa', serif;
      font-size: 1.15em
    }

    .btn {
      font-family: 'Aref Ruqaa', serif;
      font-size: 1.15em;
      color: #fff;
      background: linear-gradient(135deg, #e0698a, #b8456a);
      border: 0;
      border-radius: 999px;
      padding: 10px 30px;
      margin-top: 22px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(194, 80, 111, .4);
      opacity: 0;
      animation: in 1s ease forwards
    }

    .btn:active {
      transform: scale(.96)
    }

    /* cake */
    .banner {
      direction: ltr;
      font-family: 'Great Vibes', cursive;
      font-size: clamp(34px, 10vw, 52px);
      color: var(--accent);
      text-align: center;
      line-height: 1.2;
      text-shadow: 0 0 24px rgba(240, 138, 165, .45);
      animation: glow 3s ease-in-out infinite
    }

    @keyframes glow {
      50% {
        text-shadow: 0 0 36px rgba(240, 138, 165, .9)
      }
    }

    .cakewrap {
      width: min(78vw, 320px);
      margin: 10px 0
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible
    }

    .flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: fl .35s ease-in-out infinite alternate
    }

    @keyframes fl {
      from {
        transform: scale(1, 1) rotate(-3deg)
      }

      to {
        transform: scale(.88, 1.12) rotate(3deg)
      }
    }

    .cd {
      cursor: pointer
    }

    .cd.out .flame {
      display: none
    }

    .smoke {
      opacity: 0;
      stroke: #999;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round
    }

    .cd.out .smoke {
      animation: sm 2s ease-out forwards
    }

    @keyframes sm {
      0% {
        opacity: .7;
        transform: translateY(0)
      }

      100% {
        opacity: 0;
        transform: translateY(-34px)
      }
    }

    .hint {
      font-size: .9em;
      opacity: .75;
      text-align: center;
      min-height: 2em
    }

    .bl {
      position: absolute;
      bottom: -120px;
      width: 46px;
      height: 58px;
      border-radius: 50% 50% 48% 48%;
      opacity: .85;
      animation: rise2 linear infinite
    }

    .bl:after {
      content: "";
      position: absolute;
      bottom: -14px;
      left: 50%;
      width: 1px;
      height: 14px;
      background: currentColor;
      opacity: .5
    }

    @keyframes rise2 {
      0% {
        transform: translateY(0) translateX(0)
      }

      50% {
        transform: translateY(-60vh) translateX(14px)
      }

      100% {
        transform: translateY(-130vh) translateX(-10px)
      }
    }

    .cf {
      position: fixed;
      top: -20px;
      width: 9px;
      height: 14px;
      z-index: 5;
      animation: cfall linear forwards
    }

    @keyframes cfall {
      to {
        transform: translateY(110vh) rotate(720deg)
      }
    }

    /* messages */
    .msgs {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px 18px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: .4s
    }

    .card .top {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-family: 'Aref Ruqaa', serif;
      font-size: 1.15em;
      color: var(--accent)
    }

    .card .top small {
      margin-inline-start: auto;
      font-family: 'Amiri', serif;
      font-size: .7em;
      color: var(--ink);
      opacity: .7
    }

    .card.lock .top {
      cursor: default;
      opacity: .7
    }

    .card .body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .9s ease, margin .5s;
      white-space: pre-line
    }

    .card.open .body {
      max-height: 1400px;
      margin-top: 12px;
      border-top: 1px dashed var(--line);
      padding-top: 12px
    }

    .card.new {
      animation: pulse 2s ease-in-out infinite
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 6px rgba(240, 138, 165, .2)
      }
    }

    .sub {
      text-align: center;
      opacity: .8;
      margin-bottom: 16px
    }

    .cnt {
      font-family: 'Aref Ruqaa', serif;
      color: var(--accent);
      font-size: 1.1em
    }

    .track {
      width: 100%;
      height: 4px;
      border-radius: 4px;
      background: var(--line);
      margin: 8px 0 22px;
      overflow: hidden
    }

    .track i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #e0698a, var(--gold));
      transition: width .6s
    }

    .mc {
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #mt {
      text-align: center;
      font-size: 1.3em;
      line-height: 2.1;
      white-space: pre-line;
      animation: in 1s ease both
    }

    input,
    textarea {
      width: 100%;
      max-width: 420px;
      font-family: 'Amiri', serif;
      font-size: 1.1em;
      text-align: center;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      outline: 0;
      margin-top: 6px
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(240, 138, 165, .2)
    }

    textarea {
      resize: none
    }

    .sh {
      animation: sh .45s
    }

    @keyframes sh {

      20%,
      60% {
        transform: translateX(-8px)
      }

      40%,
      80% {
        transform: translateX(8px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01s !important
      }
    }
  </style>
</head>

<body>
  <div id="fx"></div>

  <!-- 1: الرسالة الأولى -->
  <!-- 0: بوابة -->
  <section class="stage on" id="s0">
    <div class="banner">♡</div>
    <h2>الموقع دا ليكي إنتي بس…</h2>
    <div class="sub">قولي كلمة السر😂♥️</div>
    <input id="gi" autocomplete="off" placeholder="اسم الدلع…">
    <button class="btn" id="gb">افتحي ♡</button>
    <div class="hint" id="gh"></div>
  </section>

  <!-- 1: الرسالة الأولى -->
  <section class="stage" id="s1">
    <div class="paper" id="p1"></div>
    <button class="btn" id="b1" hidden>كمّل ♡</button>
  </section>

  <!-- 2: التورتة -->
  <section class="stage" id="s2">
    <div class="banner">H.B.D Maryoumi ♥️</div>
    <div class="cakewrap">
      <svg viewBox="0 0 240 250" id="cake">
        <ellipse cx="120" cy="232" rx="112" ry="13" fill="#e9c9d2" />
        <rect x="28" y="150" width="184" height="78" rx="16" fill="#f7b6c8" />
        <path d="M28 166q15 16 31 0t31 0 31 0 31 0 31 0 29 0v-4q0-12-16-12H44q-16 0-16 12z" fill="#fff4f6" />
        <rect x="58" y="100" width="124" height="54" rx="14" fill="#ffd1dc" />
        <path d="M58 116q15 15 31 0t31 0 31 0 31 0v-4q0-12-14-12H72q-14 0-14 12z" fill="#fff4f6" />
        <g fill="#d6456f">
          <circle cx="75" cy="196" r="5" />
          <circle cx="120" cy="204" r="5" />
          <circle cx="165" cy="196" r="5" />
          <circle cx="97" cy="138" r="4" />
          <circle cx="143" cy="138" r="4" />
        </g>
        <g id="candles"></g>
      </svg>
    </div>
    <div class="hint" id="hint">اتمنّي أمنية في سرّك… والشموع هتطفي لوحدها ✨</div>
  </section>

  <!-- 3: الرسايل -->
  <section class="stage" id="s3">
    <div class="cnt" id="cnt"></div>
    <div class="track"><i id="bar"></i></div>
    <div class="paper mc">
      <div id="mt"></div>
    </div>
    <button class="btn" id="nx">الرسالة اللي بعدها ♡</button>
  </section>

  <!-- 4: الختام -->
  <section class="stage" id="s4">
    <div class="paper" id="p4"></div>
    <button class="btn" id="b4" hidden>ولسه ليكي أمنية ✨</button>
  </section>

  <!-- 5: الأمنية -->
  <section class="stage" id="s5">
    <h2>اطلبي أي حاجة… ✨</h2>
    <div class="sub">أي حاجة نفسك فيها، أو نفسك تتحقق… اكتبيها هنا، وبإذن الله هتتحقق ♡</div>
    <textarea id="wish" rows="4" placeholder="نفسي في…"></textarea>
    <button class="btn" id="send">ابعتي أمنيتك ♡</button>
    <div class="hint" id="sent"></div>
  </section>

  <script>
    /* ============ عدّل هنا ============ */
    const LETTER1 = [
      ["to", "إلى شخصي المُفضَّل..."],
      ["", "أمّا بعد،"],
      ["", "لستُ أدري من أين أبدأ، فبعض الأشخاص لا تُنصفهم الكلمات، وبعض المشاعر أكبر من أن تحتويها الحروف."],
      ["", "ولكنّي أردتُ أن أترك لك شيئاً يُشبه ما تركته في قلبي؛ أثراً جميلاً لا تمحوه الأيام، وامتناناً لا تكفيه عبارات الشكر."],
      ["", "شكراً لأنك كنتَ ذلك اللطف الذي يأتي دون موعد، وتلك البهجة التي تجعل للأيام مذاقاً أجمل، ولأن في حضورك شيئاً من الطمأنينة، وفي حديثك أُنساً لا يُشبهه شيء."],
      ["", "لعلّك لا تعلم كم من الأشياء الجميلة أصبحت أجمل بوجودك، وكم من التفاصيل الصغيرة اكتسبت معنى مختلفاً لأنك كنتَ جزءاً منها."],
      ["", "فإن كان لي أن أُهديك شيئاً اليوم، فلن يكون سوى كلماتٍ تحمل بعض ما يعجز قلبي عن قوله:"],
      ["em", "دمتَ جميلاً كما عرفتك، قريباً من الفرح، محفوظاً بعين الله، وممتلئاً بكل ما يُحبّه قلبك."],
      ["em", "فبعض الأشخاص لا نحتفل بهم في يوم ميلادهم فحسب، بل نحمد الله على وجودهم في كل يوم. ♡"]
    ];
    const LETTER4 = [
      ["to", "إلى مَن له في القلب مكانٌ لا يُشبهه أحد..."],
      ["", "أمّا بعد،"],
      ["", "انتهت الكلمات، ولكنّ ما أودّ قوله لك لم ينتهِ، فثمّة مشاعر لا تُقال مرّة واحدة، وامتنان لا تُحيط به رسالة، ومكانة لا تُغيّرها المسافات ولا تُبدّلها الأيام."],
      ["", "في يوم ميلادك، لا أتمنّى لك عاماً جميلاً فحسب، بل أتمنّى لك عُمراً تفيض فيه المسرّات، وأياماً تُشبه نقاء روحك، وأحلاماً تجد طريقها إليك، وقلباً لا يعرف من الحزن إلا عابره."],
      ["", "أسأل الله أن يُبقي ضحكتك عامرة، وأن يكتب لك من الأقدار أجملها، ومن الأماني أصدقها، وأن تكون أعوامك القادمة مليئة بما يستحقّه قلبك من خيرٍ وفرح."],
      ["", "وأمّا عنّي، فسيظلّ وجودك من الأشياء التي أمتنّ لها، وسيبقى لك في قلبي ودٌّ لا يحتاج إلى مناسبة كي يُقال، ولا إلى كلماتٍ كي يُثبت."],
      ["", "كلّ عام وأنت بخير، وكلّ عام وأنت بخيرٍ أكثر مما تمنّيت، وسلامٌ على قلبك حتى يبلغ من الحياة أجملها."],
      ["sig", "مِن قلبٍ يُحبّ وجودك، ويمتنّ لأنّ الحياة جمعته بك..."],
      ["sig em", "عيد ميلاد سعيد، يا أجمل هدايا الأقدار. ♡"]
    ];
    /* ================================== */

    const $ = s => document.querySelector(s), DAY = 864e5;
    const st = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) { } } };
    const nf = n => n.toLocaleString('ar-EG');
    function show(id) { document.querySelectorAll('.stage').forEach(s => s.classList.toggle('on', s.id === id)); scrollTo(0, 0) }

    /* خلفية قلوب */
    const fx = $('#fx');
    for (let i = 0; i < 16; i++) {
      const e = document.createElement('span'); e.className = 'fl'; e.textContent = i % 3 ? '♡' : '✦';
      e.style.cssText = `left:${Math.random() * 100}%;font-size:${12 + Math.random() * 18}px;animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 14}s`; fx.appendChild(e)
    }

    /* كتابة الرسالة سطر سطر */
    function reveal(box, lines, done) { let t = .4; lines.forEach(([c, tx]) => { const p = document.createElement('p'); p.className = c; p.textContent = tx; p.style.animationDelay = t + 's'; t += Math.max(1.1, tx.length / 55); box.appendChild(p) }); setTimeout(done, (t + .6) * 1000) }

    /* 1 */
    let started = 0; function startLetter() { if (started++) return; reveal($('#p1'), LETTER1, () => { $('#b1').hidden = false }) }
    /* بوابة اسم الدلع */
    const norm = t => t.toLowerCase().replace(/[\u064B-\u065F\u0670\u0640\s\u2665\u2661\u2764\uFE0F.!]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
    const OK = ['مريومي', 'ماريومي', 'maryoumi', 'mariomi', 'meryoumi'].map(norm); // الإجابات المقبولة
    let tries = 0;
    function gate() { const i = $('#gi'); if (OK.includes(norm(i.value))) { show('s1'); startLetter() } else { tries++; $('#gh').textContent = tries > 1 ? 'قربتي… أول حرفين: "مر" ♡' : 'مش هي دي… جربي تاني 🤍'; i.classList.remove('sh'); i.offsetWidth; i.classList.add('sh') } }
    $('#gb').onclick = gate; $('#gi').addEventListener('keydown', e => { if (e.key === 'Enter') gate() });
    $('#b1').onclick = () => { show('s2'); balloons(); setTimeout(blowAll, 8000) };

    /* 2: تورتة */
    const NS = 'http://www.w3.org/2000/svg', cg = $('#candles');
    [[95, '2'], [145, '0']].forEach(([x, n]) => {
      const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'cd');
      g.innerHTML = `<text x="${x}" y="103" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="74" fill="#ffc2d1" stroke="#e0698a" stroke-width="2.5" paint-order="stroke">${n}</text><ellipse class="flame" cx="${x}" cy="38" rx="6" ry="12" fill="#ffb73a"/><ellipse class="flame" cx="${x}" cy="41" rx="3" ry="7" fill="#fff6b0"/><path class="smoke" d="M${x} 40q-6-8 0-14t0-12"/>`; cg.appendChild(g)
    });
    function out(g) { g.classList.add('out') }
    function blowAll() { $('#hint').textContent = 'الله يحقّقلك كل أمنياتك… ♡'; document.querySelectorAll('.cd').forEach((g, i) => setTimeout(() => out(g), i * 350)); setTimeout(confetti, 1900); setTimeout(() => { show('s3'); mi = 0; showMsg() }, 5800) }
    function balloons() {
      const c = ['#ff7aa2', '#ffd35c', '#7ad7ff', '#c79bff', '#9be37d', '#ff9f68']; const s = $('#s2');
      for (let i = 0; i < 9; i++) { const b = document.createElement('div'); b.className = 'bl'; b.style.cssText = `left:${5 + i * 11}%;background:${c[i % 6]};color:${c[i % 6]};animation-duration:${9 + Math.random() * 7}s;animation-delay:${Math.random() * 5}s`; s.appendChild(b) }
    }
    function confetti() {
      const c = ['#ff7aa2', '#ffd35c', '#7ad7ff', '#c79bff', '#9be37d'];
      for (let i = 0; i < 90; i++) { const e = document.createElement('i'); e.className = 'cf'; e.style.cssText = `left:${Math.random() * 100}%;background:${c[i % 5]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .8}s`; document.body.appendChild(e); setTimeout(() => e.remove(), 6500) }
    }

    /* 5: الأمنية */
    const WA = '201014904185'; // حط رقمك بصيغة دولية بدون + (مثال: 201001234567) عشان أمنيتها تتبعتلك واتساب على طول
    $('#b4').onclick = () => show('s5');
    $('#send').onclick = async () => {
      const v = $('#wish').value.trim(); if (!v) { $('#sent').textContent = 'اكتبي أمنيتك الأول ♡'; return }
      const msg = 'أمنيتي: ' + v; try { await navigator.clipboard.writeText(msg) } catch (e) { }
      const url = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg);
      let opened = null;
      try { opened = window.open(url, '_blank', 'noopener'); } catch (e) { }
